name: Build RZVPN APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت سورس‌کد این ریپازیتوری
        uses: actions/checkout@v4
        with:
          path: source

      - name: نصب Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: ساخت اسکلت کامل پروژه فلاتر
        run: flutter create --org com.rzvpn --project-name rzvpn app

      - name: جایگزینی کد اختصاصی RZVPN
        run: |
          cp -f source/pubspec.yaml app/pubspec.yaml
          rm -rf app/lib
          cp -r source/lib app/lib

      - name: نصب پکیج‌ها
        working-directory: app
        run: flutter pub get

      - name: ساخت APK نهایی
        working-directory: app
        run: flutter build apk --release

      - name: بارگذاری APK قابل دانلود
        uses: actions/upload-artifact@v4
        with:
          name: rzvpn-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
